[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordinal-gradient-query-designs"
version = "0.1.0"
description = "Structured queries for ordinal gradient recovery under unknown curvature"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.26", "scipy>=1.12", "clarabel>=0.11,<0.12"]

[project.optional-dependencies]
test = ["pytest>=8"]
plots = ["matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires a visible CUDA GPU"]
addopts = "-ra"
